<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <!-- CSS Main File -->
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <!-- Start Header -->
    <header>
      <h1>My Library</h1>
    </header>
    <!-- Start Main -->
    <main>
      <section class="books"></section>
      <button class="add-book-button">+</button>
    </main>
    <!-- Start Dialog -->
    <dialog>
      <form>
        <h2>New Book</h2>
        <div class="field">
          <label for="title">TITLE</label>
          <input
            id="title"
            type="text"
            name="title"
            required
            placeholder="TITLE"
          />
        </div>
        <div class="field">
          <label for="author">Author</label>
          <input
            id="author"
            type="text"
            name="author"
            required
            placeholder="author"
          />
        </div>
        <div class="field">
          <label for="pages">PAGES</label>
          <input
            id="pages"
            type="number"
            name="pages"
            required
            placeholder="PAGES"
            min="24"
          />
        </div>
        <label class="toggle" for="check-read">
          Reading?:
          <input id="check-read" type="checkbox" name="are-read" />
          <span class="custom"></span>
        </label>
        <div class="menu">
          <button class="confirm">Add</button>
          <button class="cancel-button" type="reset">Cancel</button>
        </div>
      </form>
    </dialog>
    <!-- JS Main File -->
    <script src="JS/main.js"></script>
  </body>
</html>
